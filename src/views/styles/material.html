<style>
  :root {
    color-scheme: light;
    --color-marca: #379fff;
    --color-primario: #00639c;
    --color-sobre-primario: #ffffff;
    --color-contenedor-primario: #d6ecff;
    --color-sobre-contenedor-primario: #001d33;
    --color-secundario: #445e70;
    --color-fondo: #f8fafc;
    --color-superficie: #ffffff;
    --color-superficie-variante: #eef3f7;
    --color-borde: #5e6872;
    --color-texto: #101418;
    --color-texto-secundario: #494f55;
    --color-error: #b3261e;
    --color-correcto: #146c2e;
    --sombra-nivel-1: 0 1px 3px rgba(0, 0, 0, 0.16);
    --sombra-nivel-2: 0 2px 8px rgba(0, 0, 0, 0.18);
    --radio-pequeno: 4px;
    --radio-mediano: 6px;
    --radio-grande: 8px;
    font-family: "Google Sans", "Roboto", "Segoe UI", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--color-fondo); color: var(--color-texto); }
  body { min-height: 100vh; }
  button, input, select, textarea { font: inherit; }
  button { min-height: 40px; }

  .barra-superior {
    min-height: 88px;
    padding: 16px clamp(16px, 4vw, 40px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--color-superficie);
    border-bottom: 1px solid var(--color-superficie-variante);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .barra-superior h1 { margin: 2px 0 0; font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 500; }
  .etiqueta-superior { margin: 0; color: var(--color-texto-secundario); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
  .indicador-entorno { padding: 6px 10px; border-radius: var(--radio-pequeno); background: #fff1c2; color: #493700; font-size: .75rem; font-weight: 700; }
  .contenedor-aplicacion { width: min(1280px, 100%); margin: 0 auto; padding: clamp(16px, 3vw, 32px); }

  .rejilla { display: grid; gap: 16px; }
  .rejilla-dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rejilla-tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tarjeta { background: var(--color-superficie); border: 1px solid var(--color-superficie-variante); border-radius: var(--radio-grande); padding: 20px; box-shadow: var(--sombra-nivel-1); }
  .tarjeta h2, .tarjeta h3 { margin-top: 0; font-weight: 500; }
  .tarjeta-resumen strong { display: block; margin-top: 8px; font-size: 2rem; color: var(--color-primario); }
  .seccion { margin-bottom: 24px; }
  .encabezado-seccion { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .encabezado-seccion h2 { margin: 0; font-size: 1.25rem; font-weight: 500; }
  .texto-secundario { color: var(--color-texto-secundario); }
  .texto-pequeno { font-size: .85rem; }

  .campo { display: grid; gap: 6px; margin-bottom: 14px; }
  .campo label { font-size: .88rem; color: var(--color-texto-secundario); font-weight: 600; }
  .campo input, .campo select, .campo textarea, .entrada {
    width: 100%; min-height: 48px; padding: 12px 14px; color: var(--color-texto);
    background: var(--color-superficie); border: 1px solid var(--color-borde); border-radius: var(--radio-pequeno); outline: none;
  }
  .campo textarea { min-height: 116px; resize: vertical; }
  .campo input:focus, .campo select:focus, .campo textarea:focus, .entrada:focus { border: 2px solid var(--color-primario); padding: 11px 13px; }
  .campo-en-linea { display: flex; align-items: center; gap: 10px; }

  .boton { border: 1px solid transparent; border-radius: var(--radio-mediano); padding: 9px 16px; cursor: pointer; font-weight: 650; transition: background .15s, border-color .15s, transform .15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .boton:hover { filter: brightness(.96); }
  .boton:active { transform: scale(.98); }
  .boton:disabled { opacity: .45; cursor: not-allowed; }
  .boton-primario { background: var(--color-primario); color: var(--color-sobre-primario); }
  .boton-tonal { background: var(--color-contenedor-primario); color: var(--color-sobre-contenedor-primario); border-color: #8bc8f5; }
  .boton-texto { background: transparent; color: var(--color-primario); }
  .boton-error { background: var(--color-error); color: white; }
  .acciones { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }

  .tabla-contenedor { overflow: auto; border: 1px solid var(--color-superficie-variante); border-radius: var(--radio-mediano); background: white; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 14px; border-bottom: 1px solid var(--color-superficie-variante); text-align: left; vertical-align: middle; }
  th { background: var(--color-superficie-variante); color: var(--color-texto-secundario); font-size: .82rem; position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  .estado { display: inline-flex; padding: 5px 8px; border-radius: var(--radio-pequeno); background: var(--color-superficie-variante); font-size: .75rem; font-weight: 700; }
  .estado-correcto { background: #c4eed0; color: #073b18; }
  .estado-advertencia { background: #fff0c2; color: #4f3d00; }
  .estado-error { background: #ffdad6; color: #410002; }

  .capa-carga { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; background: rgba(248, 250, 252, .82); z-index: 100; }
  .indicador-circular { width: 44px; height: 44px; border: 4px solid var(--color-superficie-variante); border-top-color: var(--color-primario); border-radius: 50%; animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .mensaje-global { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); min-width: min(420px, calc(100% - 32px)); padding: 14px 18px; border-radius: var(--radio-pequeno); background: #101418; color: white; box-shadow: var(--sombra-nivel-2); z-index: 120; }
  .mensaje-error { background: var(--color-error); }
  dialog::backdrop { background: rgba(16, 20, 24, .48); backdrop-filter: blur(3px); }
  .oculto { display: none !important; }
  .vacio { padding: 40px 20px; text-align: center; color: var(--color-texto-secundario); }

  .hoja-recibo {
    --color-recibo: var(--color-primario);
    width: min(100%, 816px); min-height: 1056px; margin: 0 auto; padding: clamp(24px, 6vw, 64px);
    background: white; color: #1b1b1b; border-radius: 4px; box-shadow: var(--sombra-nivel-2); position: relative;
  }
  .hoja-recibo.formato-a4 { min-height: 1122px; }
  .encabezado-recibo { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; border-bottom: 3px solid var(--color-recibo); padding-bottom: 18px; }
  .logotipo-recibo { display: block; max-width: 180px; max-height: 90px; object-fit: contain; }
  .titulo-recibo { margin: 0; color: #101418; font-size: 1.6rem; }
  .contenido-recibo { margin: 48px 0; white-space: pre-line; line-height: 1.8; font-size: 1.06rem; }
  .zona-firma { margin-top: 60px; text-align: center; }
  .lienzo-firma { display: block; width: 100%; height: 190px; border: 2px dashed var(--color-recibo); border-radius: var(--radio-mediano); background: #fff; touch-action: none; }
  .zona-evidencia { margin-top: 28px; padding-top: 20px; border-top: 1px solid #ddd; }
  .vista-fotografia { display: block; max-width: 100%; max-height: 300px; margin: 12px auto; object-fit: contain; border-radius: var(--radio-pequeno); }
  .barra-firma { position: sticky; bottom: 10px; margin: 18px auto 0; width: min(100%, 816px); padding: 12px; background: rgba(255, 255, 255, .96); border: 1px solid var(--color-superficie-variante); border-radius: var(--radio-grande); box-shadow: var(--sombra-nivel-2); z-index: 10; }

  .material-symbols-outlined { font-size: 21px; line-height: 1; font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; }
  .icono-grande { font-size: 34px; color: var(--color-primario); }
  .solo-lectores-pantalla { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .boton-icono { width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: var(--radio-mediano); color: var(--color-primario); background: transparent; cursor: pointer; }
  .boton-icono:hover { background: var(--color-contenedor-primario); }
  .boton.procesando .material-symbols-outlined { animation: girar .8s linear infinite; }

  .resumen-compacto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .tarjeta-resumen-compacta { display: flex; align-items: center; gap: 14px; padding: 14px 16px; box-shadow: none; border-color: #c9d2da; }
  .tarjeta-resumen-compacta > .material-symbols-outlined { color: var(--color-primario); font-size: 28px; }
  .tarjeta-resumen-compacta span:not(.material-symbols-outlined) { display: block; color: var(--color-texto-secundario); font-size: .82rem; }
  .tarjeta-resumen-compacta strong { display: block; margin-top: 2px; color: var(--color-texto); font-size: 1.45rem; }

  .navegacion-operacion { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border: 1px solid #c9d2da; border-radius: var(--radio-grande); background: var(--color-superficie); }
  .boton-navegacion { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--radio-mediano); background: transparent; color: var(--color-texto-secundario); cursor: pointer; font-weight: 650; }
  .boton-navegacion.activo { background: var(--color-marca); color: #001d33; }
  .campo-tipo-recibo { max-width: 520px; }
  .acciones-principales { margin-top: 16px; }
  .entrada-captura { width: 100%; min-width: 150px; min-height: 44px; padding: 9px 10px; border: 1px solid var(--color-borde); border-radius: var(--radio-pequeno); color: var(--color-texto); background: white; }
  .entrada-captura:focus { outline: 3px solid rgba(55, 159, 255, .3); border-color: var(--color-primario); }
  .tabla-captura th:nth-child(1) { width: 25%; }
  .tabla-captura th:nth-child(2) { width: 14%; }
  .tabla-captura th:nth-child(3) { width: 35%; }
  .tabla-captura th:nth-child(4) { width: 18%; }
  .tabla-captura th:last-child { width: 56px; }
  .fila-captura.fila-invalida .entrada-captura:invalid { border-color: var(--color-error); background: #fff8f7; }
  .lista-recibos, .lista-contactos { display: grid; gap: 8px; }
  .elemento-lista-recibo { width: 100%; min-height: 64px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; text-align: left; color: var(--color-texto); background: white; border: 1px solid #c9d2da; border-radius: var(--radio-mediano); cursor: pointer; }
  .elemento-lista-recibo:hover { border-color: var(--color-marca); background: #f5faff; }
  .tarjeta-informativa { align-content: center; box-shadow: none; background: #f5faff; }
  .filtros-recibos { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(180px, .45fr) auto; align-items: end; gap: 12px; }
  .paginacion { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .acciones-tabla { justify-content: flex-start; }
  .dialogo-material { width: min(640px, calc(100% - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 20px; color: var(--color-texto); background: white; border: 1px solid #c9d2da; border-radius: var(--radio-grande); box-shadow: var(--sombra-nivel-2); }
  .dialogo-material h2 { margin: 0; }
  .encabezado-dialogo { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .elemento-contacto { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid #c9d2da; border-radius: var(--radio-mediano); cursor: pointer; }
  .estado-vacio-con-icono { min-height: 100px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: left; }
  .estado-vacio-con-icono p { margin: 0; }
  .datos-cargando .resumen-compacto, .datos-cargando .navegacion-operacion { opacity: .45; }
  .estado-carga-local { min-height: 72px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--color-texto-secundario); box-shadow: none; }
  .estado-carga-local .material-symbols-outlined { color: var(--color-primario); animation: girar .8s linear infinite; }
  .opciones-avanzadas { margin: 14px 0; padding: 10px 12px; border: 1px solid #c9d2da; border-radius: var(--radio-mediano); }
  .opciones-avanzadas summary { cursor: pointer; color: var(--color-primario); font-weight: 650; }
  .opciones-avanzadas .campo { margin: 12px 0 0; }

  @media (max-width: 760px) {
    .rejilla-dos, .rejilla-tres { grid-template-columns: 1fr; }
    .barra-superior { min-height: 72px; }
    .contenedor-aplicacion { padding: 12px; }
    .hoja-recibo { min-height: auto; padding: 22px 16px; }
    .encabezado-recibo { flex-direction: column; }
    .contenido-recibo { margin: 30px 0; }
    .resumen-compacto { grid-template-columns: 1fr; }
    .navegacion-operacion { position: sticky; top: 72px; z-index: 15; }
    .boton-navegacion { flex-direction: column; gap: 3px; font-size: .76rem; }
    .filtros-recibos { grid-template-columns: 1fr; }
    .tabla-captura-contenedor { margin-inline: -8px; }
  }
</style>
