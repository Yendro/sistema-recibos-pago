<script>
  const estadoOperacion = {
    tiposRecibo: [],
    contactos: [],
    pendientes: [],
    historial: { recibos: [], pagina: 1, totalPaginas: 1, total: 0 },
    resumen: { pendientesFirma: 0, pendientesEnvio: 0, enviados: 0 },
  };
  let identificadorReciboFirma = "";
  let identificadorReciboCorreo = "";
  let fotografiaFirmaBase64 = "";
  let lienzoTieneFirma = false;
  let dibujandoFirma = false;

  document.addEventListener("DOMContentLoaded", () => {
    configurarEventosOperacion();
    configurarLienzoFirma();
    agregarFilaCaptura();
    cargarDatosOperacion();
  });

  function configurarEventosOperacion() {
    document.querySelectorAll("[data-seccion]").forEach((boton) =>
      boton.addEventListener("click", () => cambiarSeccion(boton.dataset.seccion)),
    );
    document.getElementById("botonAgregarFila").addEventListener("click", () => agregarFilaCaptura());
    document.getElementById("botonPegarFilas").addEventListener("click", () => document.getElementById("dialogoPegar").showModal());
    document.getElementById("botonImportarFilas").addEventListener("click", importarFilasPegadas);
    document.getElementById("botonCrearRecibos").addEventListener("click", crearRecibosCapturados);
    document.getElementById("botonActualizarFirmas").addEventListener("click", actualizarPendientesFirma);
    document.getElementById("botonVolverBandeja").addEventListener("click", volverBandejaFirma);
    document.getElementById("botonLimpiarFirma").addEventListener("click", limpiarFirma);
    document.getElementById("botonConfirmarFirma").addEventListener("click", confirmarFirma);
    document.getElementById("archivoFotografiaFirma").addEventListener("change", procesarFotografiaFirma);
    document.getElementById("botonBuscarRecibos").addEventListener("click", () => cargarHistorial(1));
    document.getElementById("paginaAnterior").addEventListener("click", () => cargarHistorial(estadoOperacion.historial.pagina - 1));
    document.getElementById("paginaSiguiente").addEventListener("click", () => cargarHistorial(estadoOperacion.historial.pagina + 1));
    document.getElementById("botonCancelarCorreo").addEventListener("click", () => document.getElementById("dialogoCorreo").close());
    document.getElementById("botonEnviarCorreo").addEventListener("click", enviarCorreoSeleccionado);
    document.getElementById("dialogoCorreo").addEventListener("cancel", (evento) => {
      if (evento.currentTarget.getAttribute("aria-busy") === "true") evento.preventDefault();
    });
  }

  async function cargarDatosOperacion() {
    establecerContenidoCargando(true);
    try {
      const datos = exigirRespuestaExitosa(await ejecutarServidor("obtenerDatosOperacion"));
      document.getElementById("panelSinInicializar").classList.toggle("oculto", datos.inicializado);
      document.getElementById("contenidoOperacion").classList.toggle("oculto", !datos.inicializado);
      if (!datos.inicializado) return;
      estadoOperacion.tiposRecibo = datos.tiposRecibo || [];
      estadoOperacion.contactos = datos.contactos || [];
      estadoOperacion.pendientes = datos.pendientes?.recibos || [];
      estadoOperacion.historial = datos.historial;
      estadoOperacion.resumen = datos.resumen;
      cargarSelectorTiposRecibo();
      renderizarResumen();
      renderizarPendientesFirma();
      renderizarHistorial();
      cambiarSeccion(document.body.dataset.seccionInicial || "nuevo");
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      establecerContenidoCargando(false);
      document.getElementById("estadoCargaOperacion").classList.add("oculto");
    }
  }

  function establecerContenidoCargando(cargando) {
    document.body.classList.toggle("datos-cargando", cargando);
  }

  function cambiarSeccion(nombreSeccion) {
    const nombreValido = ["nuevo", "firmas", "historial"].includes(nombreSeccion)
      ? nombreSeccion
      : "nuevo";
    document.querySelectorAll(".panel-operacion").forEach((panel) => panel.classList.add("oculto"));
    document.getElementById(`seccion${nombreValido[0].toUpperCase()}${nombreValido.slice(1)}`).classList.remove("oculto");
    document.querySelectorAll("[data-seccion]").forEach((boton) => {
      const activo = boton.dataset.seccion === nombreValido;
      boton.classList.toggle("activo", activo);
      boton.setAttribute("aria-current", activo ? "page" : "false");
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function cargarSelectorTiposRecibo() {
    const selector = document.getElementById("tipoRecibo");
    selector.replaceChildren();
    estadoOperacion.tiposRecibo.forEach((tipo) => {
      const opcion = document.createElement("option");
      opcion.value = tipo.identificadorTipoRecibo;
      opcion.textContent = `${tipo.nombreTipoRecibo} · ${tipo.nombreProveedor}`;
      selector.append(opcion);
    });
    document.getElementById("botonCrearRecibos").disabled = !selector.options.length;
  }

  function fechaActualLocal() {
    const fecha = new Date();
    const anio = fecha.getFullYear();
    const mes = String(fecha.getMonth() + 1).padStart(2, "0");
    const dia = String(fecha.getDate()).padStart(2, "0");
    return `${anio}-${mes}-${dia}`;
  }

  function crearEntradaCaptura(tipo, nombre, valor, atributos = {}) {
    const entrada = document.createElement("input");
    entrada.type = tipo;
    entrada.name = nombre;
    entrada.value = valor ?? "";
    entrada.className = "entrada-captura";
    Object.entries(atributos).forEach(([clave, contenido]) => entrada.setAttribute(clave, contenido));
    entrada.addEventListener("input", actualizarResumenCaptura);
    return entrada;
  }

  function agregarFilaCaptura(datos = {}) {
    const cuerpo = document.getElementById("filasCaptura");
    const fila = document.createElement("tr");
    fila.className = "fila-captura";
    const campos = [
      crearEntradaCaptura("text", "cliente", datos.cliente, { placeholder: "Nombre o razón social", required: "" }),
      crearEntradaCaptura("number", "importe", datos.importe, { min: "0.01", step: "0.01", placeholder: "0.00", required: "" }),
      crearEntradaCaptura("text", "concepto", datos.concepto, { placeholder: "Concepto del pago", required: "" }),
      crearEntradaCaptura("date", "fechaPago", datos.fechaPago || fechaActualLocal(), { required: "" }),
    ];
    const etiquetas = ["Cliente", "Importe", "Concepto", "Fecha de pago"];
    campos.forEach((campo, indice) => {
      const celda = document.createElement("td");
      celda.dataset.etiqueta = etiquetas[indice];
      celda.append(campo);
      fila.append(celda);
    });
    const celdaAccion = document.createElement("td");
    celdaAccion.dataset.etiqueta = "Acciones";
    const eliminar = crearBotonIcono("delete", "Eliminar fila");
    eliminar.addEventListener("click", () => {
      fila.remove();
      if (!cuerpo.children.length) agregarFilaCaptura();
      actualizarResumenCaptura();
    });
    celdaAccion.append(eliminar);
    fila.append(celdaAccion);
    cuerpo.append(fila);
    actualizarResumenCaptura();
  }

  function obtenerFilasCaptura() {
    return Array.from(document.querySelectorAll(".fila-captura")).map((fila) => ({
      elemento: fila,
      cliente: fila.querySelector('[name="cliente"]').value.trim(),
      importe: Number(fila.querySelector('[name="importe"]').value),
      concepto: fila.querySelector('[name="concepto"]').value.trim(),
      fechaPago: fila.querySelector('[name="fechaPago"]').value,
    }));
  }

  function validarFilaCaptura(fila) {
    const estaVacia = !fila.cliente && !fila.concepto && !fila.importe;
    if (estaVacia) return { valida: false, vacia: true };
    return {
      valida: Boolean(fila.cliente && fila.concepto && fila.importe > 0 && /^\d{4}-\d{2}-\d{2}$/.test(fila.fechaPago)),
      vacia: false,
    };
  }

  function actualizarResumenCaptura() {
    let validas = 0;
    let incompletas = 0;
    obtenerFilasCaptura().forEach((fila) => {
      const validacion = validarFilaCaptura(fila);
      fila.elemento.classList.toggle("fila-invalida", !validacion.valida && !validacion.vacia);
      if (validacion.valida) validas += 1;
      else if (!validacion.vacia) incompletas += 1;
    });
    document.getElementById("resumenCaptura").textContent = `${validas} recibo(s) listos${incompletas ? ` · ${incompletas} fila(s) incompletas` : ""}.`;
  }

  function interpretarImportePegado(valor) {
    let texto = String(valor || "").trim().replace(/[$\s]/g, "");
    if (texto.includes(",") && texto.includes(".")) texto = texto.replace(/,/g, "");
    else if ((texto.match(/,/g) || []).length === 1 && !texto.includes(".")) {
      const partes = texto.split(",");
      texto = partes[1].length <= 2 ? `${partes[0]}.${partes[1]}` : partes.join("");
    } else texto = texto.replace(/,/g, "");
    return Number(texto);
  }

  function interpretarFechaPegada(valor) {
    const texto = String(valor || "").trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) return texto;
    const coincidencia = texto.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
    return coincidencia
      ? `${coincidencia[3]}-${coincidencia[2].padStart(2, "0")}-${coincidencia[1].padStart(2, "0")}`
      : "";
  }

  function importarFilasPegadas() {
    try {
      const lineas = document.getElementById("datosPegados").value
        .split(/\r?\n/)
        .filter((linea) => linea.trim());
      if (!lineas.length) throw new Error("Pega al menos una fila.");
      const filas = lineas.map((linea, indice) => {
        const columnas = linea.split("\t");
        if (columnas.length !== 4) throw new Error(`Fila ${indice + 1}: se esperaban cuatro columnas.`);
        const datos = {
          cliente: columnas[0].trim(),
          importe: interpretarImportePegado(columnas[1]),
          concepto: columnas[2].trim(),
          fechaPago: interpretarFechaPegada(columnas[3]),
        };
        if (!datos.cliente || !(datos.importe > 0) || !datos.concepto || !datos.fechaPago) {
          throw new Error(`Fila ${indice + 1}: contiene datos incompletos o inválidos.`);
        }
        return datos;
      });
      const filasActuales = obtenerFilasCaptura();
      if (filasActuales.length === 1 && validarFilaCaptura(filasActuales[0]).vacia) {
        document.getElementById("filasCaptura").replaceChildren();
      }
      filas.forEach(agregarFilaCaptura);
      document.getElementById("datosPegados").value = "";
      document.getElementById("dialogoPegar").close();
      mostrarMensaje(`${filas.length} fila(s) incorporadas y listas para editar.`);
    } catch (error) {
      mostrarMensaje(error.message, true);
    }
  }

  async function crearRecibosCapturados() {
    const filas = obtenerFilasCaptura().filter((fila) => !validarFilaCaptura(fila).vacia);
    const filaInvalida = filas.find((fila) => !validarFilaCaptura(fila).valida);
    if (!filas.length) return mostrarMensaje("Completa al menos un recibo.", true);
    if (filaInvalida) return mostrarMensaje("Corrige las filas marcadas antes de continuar.", true);
    mostrarCarga(true, "Creando recibos pendientes…");
    try {
      const respuesta = await ejecutarServidor("crearRecibosMasivo", {
        identificadorTipoRecibo: document.getElementById("tipoRecibo").value,
        recibos: filas.map(({ cliente, importe, concepto, fechaPago }) => ({ cliente, importe, concepto, fechaPago })),
      });
      const datos = exigirRespuestaExitosa(respuesta);
      estadoOperacion.pendientes.unshift(...datos.recibos);
      estadoOperacion.resumen.pendientesFirma += datos.cantidad;
      datos.recibos.slice().reverse().forEach(actualizarReciboEnHistorial);
      document.getElementById("filasCaptura").replaceChildren();
      agregarFilaCaptura();
      renderizarResumen();
      renderizarPendientesFirma();
      renderizarHistorial();
      mostrarMensaje(respuesta.mensaje);
      cambiarSeccion("firmas");
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  function renderizarResumen() {
    document.getElementById("cantidadPendientesFirma").textContent = estadoOperacion.resumen.pendientesFirma;
    document.getElementById("cantidadPendientesEnvio").textContent = estadoOperacion.resumen.pendientesEnvio;
    document.getElementById("cantidadEnviados").textContent = estadoOperacion.resumen.enviados;
  }

  async function actualizarPendientesFirma() {
    const boton = document.getElementById("botonActualizarFirmas");
    establecerBotonProcesando(boton, true);
    try {
      const datos = exigirRespuestaExitosa(await ejecutarServidor("listarRecibos", {
        estados: ["PENDIENTE_FIRMA", "ERROR_PDF"], pagina: 1, tamanoPagina: 100,
      }));
      estadoOperacion.pendientes = datos.recibos;
      renderizarPendientesFirma();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      establecerBotonProcesando(boton, false);
    }
  }

  function renderizarPendientesFirma() {
    const contenedor = document.getElementById("listaPendientesFirma");
    contenedor.replaceChildren();
    if (!estadoOperacion.pendientes.length) {
      contenedor.append(crearEstadoVacio("check_circle", "No hay recibos pendientes de firma."));
      return;
    }
    estadoOperacion.pendientes.forEach((recibo) => {
      const boton = document.createElement("button");
      boton.type = "button";
      boton.className = "elemento-lista-recibo";
      boton.addEventListener("click", () => abrirReciboFirma(recibo.identificadorRecibo));
      const detalle = document.createElement("div");
      detalle.append(
        crearElementoTexto("strong", recibo.folio),
        crearElementoTexto("span", `${recibo.cliente} · ${formatearMoneda(recibo.importe)}`, "texto-secundario texto-pequeno"),
      );
      detalle.lastChild.style.display = "block";
      boton.append(crearIconoMaterial("receipt_long"), detalle, crearIconoMaterial("chevron_right"));
      contenedor.append(boton);
    });
  }

  async function abrirReciboFirma(identificadorRecibo) {
    mostrarCarga(true, "Preparando el recibo…");
    try {
      const datos = exigirRespuestaExitosa(await ejecutarServidor("obtenerReciboParaFirma", identificadorRecibo));
      identificadorReciboFirma = identificadorRecibo;
      fotografiaFirmaBase64 = "";
      const { recibo, tipoRecibo } = datos;
      const hoja = document.getElementById("hojaFirma");
      hoja.style.setProperty("--color-recibo", tipoRecibo.colorPrincipal);
      hoja.classList.toggle("formato-a4", tipoRecibo.formatoPapel === "A4");
      document.getElementById("empresaFirma").textContent = tipoRecibo.nombreEmpresa;
      document.getElementById("folioFirma").textContent = recibo.folio;
      document.getElementById("fechaFirmaVista").textContent = formatearFecha(recibo.fechaPago);
      document.getElementById("contenidoFirma").textContent = resolverTextoVista(tipoRecibo.textoPrincipal, recibo, tipoRecibo);
      const logotipo = document.getElementById("logotipoFirma");
      logotipo.src = tipoRecibo.logotipoUrlDatos || "";
      logotipo.classList.toggle("oculto", !tipoRecibo.logotipoUrlDatos);
      document.getElementById("vistaFotografiaFirma").classList.add("oculto");
      document.getElementById("sinFotografia").classList.remove("oculto");
      document.getElementById("archivoFotografiaFirma").value = "";
      document.getElementById("bandejaFirmas").classList.add("oculto");
      document.getElementById("panelFirma").classList.remove("oculto");
      window.setTimeout(limpiarFirma, 0);
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  function resolverTextoVista(texto, recibo, tipoRecibo) {
    const valores = {
      Folio: recibo.folio, FechaPago: formatearFecha(recibo.fechaPago),
      FechaCreacion: formatearFecha(recibo.fechaCreacion), Cliente: recibo.cliente,
      Proveedor: tipoRecibo.nombreProveedor, Importe: formatearMoneda(recibo.importe),
      ImporteLetra: recibo.importeLetra, Concepto: recibo.concepto,
    };
    return String(texto || "").replace(/{{\s*([^{}]+)\s*}}/g, (coincidencia, variable) => valores[variable.trim()] ?? coincidencia);
  }

  function configurarLienzoFirma() {
    const lienzo = document.getElementById("lienzoFirma");
    lienzo.addEventListener("pointerdown", iniciarTrazoFirma);
    lienzo.addEventListener("pointermove", continuarTrazoFirma);
    ["pointerup", "pointercancel", "pointerleave"].forEach((evento) => lienzo.addEventListener(evento, terminarTrazoFirma));
  }

  function prepararDimensionLienzo() {
    const lienzo = document.getElementById("lienzoFirma");
    const proporcion = Math.max(1, window.devicePixelRatio || 1);
    const rectangulo = lienzo.getBoundingClientRect();
    lienzo.width = Math.round(rectangulo.width * proporcion);
    lienzo.height = Math.round(rectangulo.height * proporcion);
    const contexto = lienzo.getContext("2d");
    contexto.scale(proporcion, proporcion);
    contexto.fillStyle = "#FFFFFF";
    contexto.fillRect(0, 0, rectangulo.width, rectangulo.height);
    contexto.strokeStyle = "#101418";
    contexto.lineWidth = 2.4;
    contexto.lineCap = "round";
    contexto.lineJoin = "round";
  }

  function obtenerPuntoFirma(evento) {
    const rectangulo = evento.currentTarget.getBoundingClientRect();
    return { x: evento.clientX - rectangulo.left, y: evento.clientY - rectangulo.top };
  }

  function iniciarTrazoFirma(evento) {
    evento.preventDefault();
    dibujandoFirma = true;
    evento.currentTarget.setPointerCapture(evento.pointerId);
    const punto = obtenerPuntoFirma(evento);
    const contexto = evento.currentTarget.getContext("2d");
    contexto.beginPath();
    contexto.moveTo(punto.x, punto.y);
  }

  function continuarTrazoFirma(evento) {
    if (!dibujandoFirma) return;
    evento.preventDefault();
    const punto = obtenerPuntoFirma(evento);
    const contexto = evento.currentTarget.getContext("2d");
    contexto.lineTo(punto.x, punto.y);
    contexto.stroke();
    lienzoTieneFirma = true;
  }

  function terminarTrazoFirma() { dibujandoFirma = false; }
  function limpiarFirma() { prepararDimensionLienzo(); lienzoTieneFirma = false; }

  async function procesarFotografiaFirma(evento) {
    try {
      fotografiaFirmaBase64 = await comprimirImagen(evento.target.files[0], 1200, .78);
      const vista = document.getElementById("vistaFotografiaFirma");
      vista.src = fotografiaFirmaBase64;
      vista.classList.remove("oculto");
      document.getElementById("sinFotografia").classList.add("oculto");
    } catch (error) {
      fotografiaFirmaBase64 = "";
      mostrarMensaje(error.message, true);
    }
  }

  async function confirmarFirma() {
    if (!lienzoTieneFirma) return mostrarMensaje("Solicita al cliente que firme el recibo.", true);
    if (!fotografiaFirmaBase64) return mostrarMensaje("Toma la fotografía antes de continuar.", true);
    if (!window.confirm("¿La firma y la fotografía fueron revisadas y son correctas?")) return;
    mostrarCarga(true, "Generando el PDF final…");
    try {
      const firmaBase64 = document.getElementById("lienzoFirma").toDataURL("image/png");
      const respuesta = await ejecutarServidor("firmarYGenerarPdf", identificadorReciboFirma, firmaBase64, fotografiaFirmaBase64);
      const datos = exigirRespuestaExitosa(respuesta);
      estadoOperacion.pendientes = estadoOperacion.pendientes.filter((recibo) => recibo.identificadorRecibo !== identificadorReciboFirma);
      estadoOperacion.resumen.pendientesFirma = Math.max(0, estadoOperacion.resumen.pendientesFirma - 1);
      estadoOperacion.resumen.pendientesEnvio += 1;
      actualizarReciboEnHistorial(datos.recibo);
      renderizarResumen();
      renderizarPendientesFirma();
      renderizarHistorial();
      volverBandejaFirma();
      cambiarSeccion("historial");
      mostrarMensaje(respuesta.mensaje);
      if (estadoOperacion.contactos.length) abrirDialogoCorreo(datos.recibo.identificadorRecibo);
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  function volverBandejaFirma() {
    identificadorReciboFirma = "";
    fotografiaFirmaBase64 = "";
    document.getElementById("panelFirma").classList.add("oculto");
    document.getElementById("bandejaFirmas").classList.remove("oculto");
  }

  async function cargarHistorial(pagina) {
    if (pagina < 1 || pagina > estadoOperacion.historial.totalPaginas) return;
    const boton = document.getElementById("botonBuscarRecibos");
    establecerBotonProcesando(boton, true);
    try {
      estadoOperacion.historial = exigirRespuestaExitosa(await ejecutarServidor("listarRecibos", {
        pagina, tamanoPagina: 25,
        estado: document.getElementById("estadoRecibos").value,
        busqueda: document.getElementById("busquedaRecibos").value,
      }));
      renderizarHistorial();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      establecerBotonProcesando(boton, false);
    }
  }

  function actualizarReciboEnHistorial(recibo) {
    const posicion = estadoOperacion.historial.recibos.findIndex((elemento) => elemento.identificadorRecibo === recibo.identificadorRecibo);
    if (posicion >= 0) estadoOperacion.historial.recibos[posicion] = recibo;
    else if (!document.getElementById("estadoRecibos").value && !document.getElementById("busquedaRecibos").value.trim()) {
      estadoOperacion.historial.recibos.unshift(recibo);
      estadoOperacion.historial.recibos = estadoOperacion.historial.recibos.slice(0, 25);
      estadoOperacion.historial.total += 1;
      estadoOperacion.historial.totalPaginas = Math.max(1, Math.ceil(estadoOperacion.historial.total / 25));
    }
  }

  function renderizarHistorial() {
    const cuerpo = document.getElementById("tablaRecibos");
    cuerpo.replaceChildren();
    const recibos = estadoOperacion.historial.recibos || [];
    if (!recibos.length) {
      const fila = document.createElement("tr");
      const celda = crearElementoTexto("td", "No se encontraron recibos.", "vacio");
      celda.colSpan = 6;
      fila.append(celda);
      cuerpo.append(fila);
    } else {
      recibos.forEach((recibo) => cuerpo.append(crearFilaHistorial(recibo)));
    }
    const historial = estadoOperacion.historial;
    document.getElementById("indicadorPagina").textContent = `Página ${historial.pagina} de ${historial.totalPaginas} · ${historial.total} recibo(s)`;
    document.getElementById("paginaAnterior").disabled = historial.pagina <= 1;
    document.getElementById("paginaSiguiente").disabled = historial.pagina >= historial.totalPaginas;
  }

  function crearFilaHistorial(recibo) {
    const fila = document.createElement("tr");
    fila.append(
      crearElementoTexto("td", recibo.folio), crearElementoTexto("td", recibo.cliente),
      crearElementoTexto("td", recibo.nombreTipoRecibo), crearElementoTexto("td", formatearMoneda(recibo.importe)),
    );
    const celdaEstado = document.createElement("td");
    celdaEstado.append(crearElementoTexto("span", traducirEstado(recibo.estado), `estado ${claseEstado(recibo.estado)}`));
    const celdaAcciones = document.createElement("td");
    const acciones = document.createElement("div");
    acciones.className = "acciones acciones-tabla";
    if (recibo.urlPdf) {
      const abrir = crearBotonConIcono("open_in_new", "Abrir PDF", "boton boton-texto");
      abrir.addEventListener("click", () => window.open(recibo.urlPdf, "_blank", "noopener"));
      acciones.append(abrir);
    }
    if (["FIRMADO", "ERROR_ENVIO"].includes(recibo.estado)) {
      const enviar = crearBotonConIcono("mail", "Enviar", "boton boton-primario");
      enviar.addEventListener("click", () => abrirDialogoCorreo(recibo.identificadorRecibo));
      acciones.append(enviar);
    }
    celdaAcciones.append(acciones);
    fila.append(celdaEstado, celdaAcciones);
    return fila;
  }

  function traducirEstado(estado) {
    return ({ PENDIENTE_FIRMA: "Pendiente de firma", FIRMADO: "Pendiente de envío", ENVIADO: "Enviado", ERROR_PDF: "Error de PDF", ERROR_ENVIO: "Error de envío", ANULADO: "Anulado" })[estado] || estado;
  }

  function claseEstado(estado) {
    if (estado === "ENVIADO") return "estado-correcto";
    if (estado.startsWith("ERROR")) return "estado-error";
    return "estado-advertencia";
  }

  function abrirDialogoCorreo(identificadorRecibo) {
    identificadorReciboCorreo = identificadorRecibo;
    establecerDialogoCorreoProcesando(false);
    const contenedor = document.getElementById("contactosCorreo");
    contenedor.replaceChildren();
    if (!estadoOperacion.contactos.length) {
      contenedor.append(crearEstadoVacio("mail", "Configura al menos un contacto activo."));
      document.getElementById("botonEnviarCorreo").disabled = true;
    } else {
      document.getElementById("botonEnviarCorreo").disabled = false;
      estadoOperacion.contactos.forEach((contacto) => {
        const etiqueta = document.createElement("label");
        etiqueta.className = "elemento-contacto";
        const casilla = document.createElement("input");
        casilla.type = "checkbox";
        casilla.value = contacto.identificadorContacto;
        etiqueta.append(casilla, crearElementoTexto("span", `${contacto.nombre} · ${contacto.correoOriginal}`));
        contenedor.append(etiqueta);
      });
    }
    document.getElementById("dialogoCorreo").showModal();
  }

  function mostrarEstadoEnvioCorreo(mensaje, esError = false) {
    const estado = document.getElementById("estadoEnvioCorreo");
    estado.replaceChildren(
      crearIconoMaterial(esError ? "close" : "refresh"),
      document.createTextNode(mensaje),
    );
    estado.classList.toggle("estado-error-local", esError);
    estado.classList.remove("oculto");
  }

  function establecerDialogoCorreoProcesando(procesando) {
    const dialogo = document.getElementById("dialogoCorreo");
    const botonEnviar = document.getElementById("botonEnviarCorreo");
    const botonCancelar = document.getElementById("botonCancelarCorreo");
    dialogo.setAttribute("aria-busy", procesando ? "true" : "false");
    botonEnviar.disabled = procesando;
    botonCancelar.disabled = procesando;
    document.querySelectorAll("#contactosCorreo input").forEach((casilla) => {
      casilla.disabled = procesando;
    });
    botonEnviar.replaceChildren(
      crearIconoMaterial(procesando ? "refresh" : "mail"),
      document.createTextNode(procesando ? "Enviando…" : "Enviar PDF"),
    );
    botonEnviar.classList.toggle("procesando", procesando);
    if (procesando) mostrarEstadoEnvioCorreo("Enviando el recibo por correo…");
    else document.getElementById("estadoEnvioCorreo").classList.add("oculto");
  }

  async function enviarCorreoSeleccionado() {
    const seleccionados = Array.from(document.querySelectorAll("#contactosCorreo input:checked")).map((elemento) => elemento.value);
    if (!seleccionados.length) {
      mostrarEstadoEnvioCorreo("Selecciona al menos un contacto.", true);
      return;
    }
    establecerDialogoCorreoProcesando(true);
    try {
      const respuesta = await ejecutarServidor("enviarReciboPorCorreo", identificadorReciboCorreo, seleccionados);
      const recibo = exigirRespuestaExitosa(respuesta);
      actualizarReciboEnHistorial(recibo);
      estadoOperacion.resumen.pendientesEnvio = Math.max(0, estadoOperacion.resumen.pendientesEnvio - 1);
      estadoOperacion.resumen.enviados += 1;
      renderizarResumen();
      renderizarHistorial();
      document.getElementById("dialogoCorreo").close();
      establecerDialogoCorreoProcesando(false);
      mostrarMensaje(respuesta.mensaje);
    } catch (error) {
      establecerDialogoCorreoProcesando(false);
      mostrarEstadoEnvioCorreo(error.message, true);
    }
  }
</script>
