<script>
  let tiposReciboConfigurados = [];
  let contactosConfigurados = [];
  const identificadoresContactosSeleccionados = new Set();

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("formularioTipoRecibo").addEventListener("submit", guardarTipoDesdeFormulario);
    document.getElementById("formularioContacto").addEventListener("submit", guardarContactoDesdeFormulario);
    document.getElementById("botonNuevoTipo").addEventListener("click", limpiarFormularioTipo);
    document.getElementById("botonEliminarTipo").addEventListener("click", eliminarTipoSeleccionado);
    document.getElementById("botonNuevoContacto").addEventListener("click", limpiarFormularioContacto);
    document.getElementById("botonEliminarContacto").addEventListener("click", eliminarContactoSeleccionado);
    document.getElementById("botonAbrirContactosMasivos").addEventListener("click", abrirDialogoContactosMasivos);
    document.getElementById("botonCerrarContactosMasivos").addEventListener("click", cerrarDialogoContactosMasivos);
    document.getElementById("botonCancelarContactosMasivos").addEventListener("click", cerrarDialogoContactosMasivos);
    document.getElementById("botonAgregarFilaContacto").addEventListener("click", () => agregarFilaContactoMasivo());
    document.getElementById("botonIncorporarContactosPegados").addEventListener("click", incorporarContactosPegados);
    document.getElementById("botonGuardarContactosMasivos").addEventListener("click", guardarContactosMasivosDesdeDialogo);
    document.getElementById("botonSeleccionarTodosContactos").addEventListener("click", alternarSeleccionTodosContactos);
    document.getElementById("botonEliminarContactosSeleccionados").addEventListener("click", eliminarContactosSeleccionados);
    document.getElementById("dialogoContactosMasivos").addEventListener("cancel", (evento) => {
      if (evento.currentTarget.getAttribute("aria-busy") === "true") evento.preventDefault();
    });
    document.getElementById("botonInicializar").addEventListener("click", inicializarEntorno);
    document.getElementById("botonAbrirReporte").addEventListener("click", abrirReporte);
    cargarConfiguracion();
  });

  async function cargarConfiguracion() {
    document.body.classList.add("datos-cargando");
    try {
      const datos = exigirRespuestaExitosa(await ejecutarServidor("obtenerConfiguracionParaWeb"));
      document.getElementById("panelSinInicializar").classList.toggle("oculto", datos.inicializado);
      document.getElementById("contenidoConfiguracion").classList.toggle("oculto", !datos.inicializado);
      if (!datos.inicializado) return;
      tiposReciboConfigurados = datos.tiposRecibo;
      contactosConfigurados = datos.contactos;
      identificadoresContactosSeleccionados.clear();
      renderizarTiposRecibo();
      renderizarContactos();
      if (!document.getElementById("identificadorTipoRecibo").value && tiposReciboConfigurados.length) {
        editarTipoRecibo(tiposReciboConfigurados[0].identificadorTipoRecibo);
      }
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      document.body.classList.remove("datos-cargando");
      document.getElementById("estadoCargaConfiguracion").classList.add("oculto");
    }
  }

  async function inicializarEntorno() {
    mostrarCarga(true, "Creando estructura en Drive…");
    try {
      const respuesta = await ejecutarServidor(
        "inicializarSistemaPruebas",
        document.getElementById("directorioContenedorInicializacion").value,
      );
      exigirRespuestaExitosa(respuesta);
      mostrarMensaje(respuesta.mensaje);
      await cargarConfiguracion();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  function renderizarTiposRecibo() {
    const contenedor = document.getElementById("listaTiposRecibo");
    contenedor.replaceChildren();
    tiposReciboConfigurados.forEach((tipo) => {
      const tarjeta = document.createElement("button");
      tarjeta.type = "button";
      tarjeta.className = "tarjeta boton-texto";
      tarjeta.style.textAlign = "left";
      tarjeta.addEventListener("click", () => editarTipoRecibo(tipo.identificadorTipoRecibo));
      const titulo = crearElementoTexto("strong", tipo.nombreTipoRecibo);
      const detalle = crearElementoTexto("span", `${tipo.nombreProveedor} · ${tipo.formatoPapel}`, "texto-secundario texto-pequeno");
      detalle.style.display = "block";
      tarjeta.append(titulo, detalle);
      contenedor.append(tarjeta);
    });
  }

  function editarTipoRecibo(identificador) {
    const tipo = tiposReciboConfigurados.find((elemento) => elemento.identificadorTipoRecibo === identificador);
    if (!tipo) return;
    document.getElementById("identificadorTipoRecibo").value = tipo.identificadorTipoRecibo;
    document.getElementById("nombreTipoRecibo").value = tipo.nombreTipoRecibo;
    document.getElementById("nombreEmpresa").value = tipo.nombreEmpresa;
    document.getElementById("nombreProveedor").value = tipo.nombreProveedor;
    document.getElementById("prefijoFolio").value = tipo.prefijoFolio;
    document.getElementById("formatoPapel").value = tipo.formatoPapel;
    document.getElementById("colorPrincipal").value = tipo.colorPrincipal;
    document.getElementById("tipoReciboActivo").checked = tipo.activo;
    document.getElementById("botonEliminarTipo").classList.remove("oculto");
  }

  function limpiarFormularioTipo() {
    document.getElementById("formularioTipoRecibo").reset();
    document.getElementById("identificadorTipoRecibo").value = "";
    document.getElementById("colorPrincipal").value = "#0E6BA8";
    document.getElementById("tipoReciboActivo").checked = true;
    document.getElementById("botonEliminarTipo").classList.add("oculto");
  }

  async function eliminarTipoSeleccionado() {
    const identificador = document.getElementById("identificadorTipoRecibo").value;
    const tipo = tiposReciboConfigurados.find((elemento) => elemento.identificadorTipoRecibo === identificador);
    if (!tipo || !window.confirm(`¿Eliminar definitivamente el tipo ${tipo.nombreTipoRecibo}?`)) return;
    mostrarCarga(true, "Eliminando tipo de recibo…");
    try {
      const respuesta = await ejecutarServidor("eliminarTipoRecibo", identificador);
      exigirRespuestaExitosa(respuesta);
      limpiarFormularioTipo();
      mostrarMensaje(respuesta.mensaje);
      await cargarConfiguracion();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  async function guardarTipoDesdeFormulario(evento) {
    evento.preventDefault();
    mostrarCarga(true, "Guardando tipo de recibo…");
    try {
      const archivo = document.getElementById("archivoLogotipo").files[0];
      const logotipoBase64 = archivo
        ? await comprimirImagen(archivo, 600, .82, true)
        : "";
      const respuesta = await ejecutarServidor("guardarTipoRecibo", {
        identificadorTipoRecibo: document.getElementById("identificadorTipoRecibo").value,
        nombreTipoRecibo: document.getElementById("nombreTipoRecibo").value,
        nombreEmpresa: document.getElementById("nombreEmpresa").value,
        nombreProveedor: document.getElementById("nombreProveedor").value,
        prefijoFolio: document.getElementById("prefijoFolio").value,
        formatoPapel: document.getElementById("formatoPapel").value,
        colorPrincipal: document.getElementById("colorPrincipal").value,
        activo: document.getElementById("tipoReciboActivo").checked,
      }, logotipoBase64);
      exigirRespuestaExitosa(respuesta);
      mostrarMensaje(respuesta.mensaje);
      document.getElementById("archivoLogotipo").value = "";
      await cargarConfiguracion();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  function renderizarContactos() {
    const contenedor = document.getElementById("listaContactos");
    contenedor.replaceChildren();
    if (!contactosConfigurados.length) {
      contenedor.append(crearElementoTexto("p", "No hay contactos configurados.", "texto-secundario"));
      actualizarSeleccionContactos();
      return;
    }
    contactosConfigurados.forEach((contacto) => {
      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjeta elemento-contacto-configuracion";
      const casilla = document.createElement("input");
      casilla.type = "checkbox";
      casilla.value = contacto.identificadorContacto;
      casilla.checked = identificadoresContactosSeleccionados.has(
        contacto.identificadorContacto,
      );
      casilla.setAttribute("aria-label", `Seleccionar ${contacto.nombre}`);
      casilla.addEventListener("change", () => {
        if (casilla.checked) {
          identificadoresContactosSeleccionados.add(contacto.identificadorContacto);
        } else {
          identificadoresContactosSeleccionados.delete(contacto.identificadorContacto);
        }
        actualizarSeleccionContactos();
      });
      const contenido = document.createElement("button");
      contenido.type = "button";
      contenido.className = "boton-contacto-configuracion";
      contenido.addEventListener("click", () => editarContacto(contacto.identificadorContacto));
      contenido.append(
        crearElementoTexto("strong", contacto.nombre),
        crearElementoTexto("span", contacto.correoOriginal, "texto-secundario texto-pequeno"),
      );
      contenido.lastChild.style.display = "block";
      tarjeta.append(casilla, contenido);
      contenedor.append(tarjeta);
    });
    actualizarSeleccionContactos();
  }

  function actualizarSeleccionContactos() {
    const cantidad = identificadoresContactosSeleccionados.size;
    document.getElementById("resumenSeleccionContactos").textContent = cantidad
      ? `${cantidad} contacto(s) seleccionado(s).`
      : "Ningún contacto seleccionado.";
    document.getElementById("botonEliminarContactosSeleccionados").disabled = !cantidad;
    document.getElementById("botonSeleccionarTodosContactos").disabled = !contactosConfigurados.length;
    document.getElementById("botonSeleccionarTodosContactos").textContent =
      contactosConfigurados.length && cantidad === contactosConfigurados.length
        ? "Limpiar selección"
        : "Seleccionar todos";
  }

  function alternarSeleccionTodosContactos() {
    const seleccionar =
      identificadoresContactosSeleccionados.size !== contactosConfigurados.length;
    identificadoresContactosSeleccionados.clear();
    if (seleccionar) {
      contactosConfigurados.forEach((contacto) =>
        identificadoresContactosSeleccionados.add(
          contacto.identificadorContacto,
        ),
      );
    }
    renderizarContactos();
  }

  async function eliminarContactosSeleccionados() {
    const identificadores = Array.from(identificadoresContactosSeleccionados);
    if (!identificadores.length) return;
    if (!window.confirm(
      `¿Eliminar definitivamente ${identificadores.length} contacto(s) seleccionado(s)?`,
    )) return;

    const boton = document.getElementById("botonEliminarContactosSeleccionados");
    establecerBotonProcesando(boton, true);
    mostrarCarga(true, "Eliminando contactos…");
    try {
      const respuesta = await ejecutarServidor(
        "eliminarContactosMasivos",
        identificadores,
      );
      exigirRespuestaExitosa(respuesta);
      limpiarFormularioContacto();
      mostrarMensaje(respuesta.mensaje);
      await cargarConfiguracion();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      establecerBotonProcesando(boton, false);
      mostrarCarga(false);
      actualizarSeleccionContactos();
    }
  }

  function abrirDialogoContactosMasivos() {
    const dialogo = document.getElementById("dialogoContactosMasivos");
    document.getElementById("filasContactosMasivos").replaceChildren();
    document.getElementById("datosContactosPegados").value = "";
    ocultarEstadoContactosMasivos();
    agregarFilaContactoMasivo();
    actualizarResumenContactosMasivos();
    dialogo.showModal();
  }

  function cerrarDialogoContactosMasivos() {
    const dialogo = document.getElementById("dialogoContactosMasivos");
    if (dialogo.getAttribute("aria-busy") !== "true") dialogo.close();
  }

  function crearEntradaContactoMasivo(tipo, nombre, valor, marcador) {
    const entrada = document.createElement("input");
    entrada.type = tipo;
    entrada.name = nombre;
    entrada.value = valor || "";
    entrada.placeholder = marcador;
    entrada.required = true;
    entrada.className = "entrada-captura";
    entrada.addEventListener("input", actualizarResumenContactosMasivos);
    return entrada;
  }

  function agregarFilaContactoMasivo(datos = {}) {
    const cuerpo = document.getElementById("filasContactosMasivos");
    const fila = document.createElement("tr");
    fila.className = "fila-contacto-masivo";
    const campos = [
      crearEntradaContactoMasivo("text", "nombreContactoMasivo", datos.nombre, "Nombre del contacto"),
      crearEntradaContactoMasivo("email", "correoContactoMasivo", datos.correo, "correo@empresa.com"),
    ];
    ["Nombre", "Correo"].forEach((etiqueta, indice) => {
      const celda = document.createElement("td");
      celda.dataset.etiqueta = etiqueta;
      celda.append(campos[indice]);
      fila.append(celda);
    });
    const celdaAccion = document.createElement("td");
    celdaAccion.dataset.etiqueta = "Acciones";
    const botonEliminar = crearBotonIcono("delete", "Eliminar fila");
    botonEliminar.addEventListener("click", () => {
      fila.remove();
      if (!cuerpo.children.length) agregarFilaContactoMasivo();
      actualizarResumenContactosMasivos();
    });
    celdaAccion.append(botonEliminar);
    fila.append(celdaAccion);
    cuerpo.append(fila);
    actualizarResumenContactosMasivos();
  }

  function obtenerFilasContactosMasivos() {
    return Array.from(document.querySelectorAll(".fila-contacto-masivo")).map(
      (fila) => ({
        elemento: fila,
        entradaCorreo: fila.querySelector('[name="correoContactoMasivo"]'),
        nombre: fila.querySelector('[name="nombreContactoMasivo"]').value.trim(),
        correo: fila.querySelector('[name="correoContactoMasivo"]').value.trim(),
      }),
    );
  }

  function validarFilaContactoMasivo(fila) {
    const vacia = !fila.nombre && !fila.correo;
    return {
      vacia,
      valida: !vacia && Boolean(
        fila.nombre && fila.correo && fila.entradaCorreo.checkValidity(),
      ),
    };
  }

  function actualizarResumenContactosMasivos() {
    let validas = 0;
    let incompletas = 0;
    const correos = new Set();
    let duplicadas = 0;
    obtenerFilasContactosMasivos().forEach((fila) => {
      const validacion = validarFilaContactoMasivo(fila);
      const correoNormalizado = fila.correo.toLocaleLowerCase();
      const repetida = Boolean(correoNormalizado && correos.has(correoNormalizado));
      if (correoNormalizado) correos.add(correoNormalizado);
      fila.elemento.classList.toggle(
        "fila-invalida",
        (!validacion.valida && !validacion.vacia) || repetida,
      );
      if (repetida) duplicadas += 1;
      else if (validacion.valida) validas += 1;
      else if (!validacion.vacia) incompletas += 1;
    });
    document.getElementById("resumenContactosMasivos").textContent =
      `${validas} contacto(s) listos` +
      `${incompletas ? ` · ${incompletas} fila(s) incompletas` : ""}` +
      `${duplicadas ? ` · ${duplicadas} correo(s) repetidos` : ""}.`;
  }

  function incorporarContactosPegados() {
    try {
      let filas = document.getElementById("datosContactosPegados").value
        .split(/\r?\n/)
        .filter((linea) => linea.trim())
        .map((linea, indice) => {
          const columnas = linea.split("\t");
          if (columnas.length !== 2) {
            throw new Error(`Fila ${indice + 1}: se esperaban dos columnas.`);
          }
          return { nombre: columnas[0].trim(), correo: columnas[1].trim() };
        });
      if (
        filas.length &&
        filas[0].nombre.toLocaleUpperCase() === "NOMBRE" &&
        ["CORREO", "EMAIL", "E-MAIL"].includes(
          filas[0].correo.toLocaleUpperCase(),
        )
      ) {
        filas = filas.slice(1);
      }
      if (!filas.length) throw new Error("Pega al menos un contacto.");
      if (filas.some((fila) => !fila.nombre || !fila.correo)) {
        throw new Error("Los nombres y correos pegados son obligatorios.");
      }

      const filasActuales = obtenerFilasContactosMasivos();
      if (
        filasActuales.length === 1 &&
        validarFilaContactoMasivo(filasActuales[0]).vacia
      ) {
        document.getElementById("filasContactosMasivos").replaceChildren();
      }
      filas.forEach(agregarFilaContactoMasivo);
      document.getElementById("datosContactosPegados").value = "";
      mostrarEstadoContactosMasivos(
        `${filas.length} fila(s) incorporadas y listas para revisar.`,
      );
    } catch (error) {
      mostrarEstadoContactosMasivos(error.message, true);
    }
  }

  function mostrarEstadoContactosMasivos(
    mensaje,
    esError = false,
    procesando = false,
  ) {
    const estado = document.getElementById("estadoContactosMasivos");
    estado.className =
      "estado-proceso-dialogo" +
      (esError
        ? " estado-error-local"
        : procesando
          ? ""
          : " estado-informativo-local");
    estado.setAttribute("role", esError ? "alert" : "status");
    estado.replaceChildren(
      crearIconoMaterial(procesando ? "refresh" : esError ? "info" : "check_circle"),
      document.createTextNode(mensaje),
    );
  }

  function ocultarEstadoContactosMasivos() {
    const estado = document.getElementById("estadoContactosMasivos");
    estado.classList.add("oculto");
    estado.replaceChildren();
    estado.setAttribute("role", "status");
  }

  function establecerDialogoContactosProcesando(procesando) {
    const dialogo = document.getElementById("dialogoContactosMasivos");
    dialogo.setAttribute("aria-busy", procesando ? "true" : "false");
    dialogo.querySelectorAll("button, input, textarea").forEach((control) => {
      control.disabled = procesando;
    });
    if (procesando) {
      mostrarEstadoContactosMasivos(
        "Guardando contactos…",
        false,
        true,
      );
    }
  }

  async function guardarContactosMasivosDesdeDialogo() {
    const filas = obtenerFilasContactosMasivos().filter(
      (fila) => !validarFilaContactoMasivo(fila).vacia,
    );
    ocultarEstadoContactosMasivos();
    if (!filas.length) {
      return mostrarEstadoContactosMasivos(
        "Agrega al menos un contacto.",
        true,
      );
    }
    if (filas.some((fila) => !validarFilaContactoMasivo(fila).valida)) {
      return mostrarEstadoContactosMasivos(
        "Corrige las filas marcadas antes de continuar.",
        true,
      );
    }
    const correos = filas.map((fila) => fila.correo.toLocaleLowerCase());
    if (new Set(correos).size !== correos.length) {
      return mostrarEstadoContactosMasivos(
        "No repitas correos dentro del mismo lote.",
        true,
      );
    }
    if (!window.confirm(`¿Guardar ${filas.length} contacto(s)?`)) return;

    establecerDialogoContactosProcesando(true);
    let errorOperacion = null;
    try {
      const respuesta = await ejecutarServidor(
        "guardarContactosMasivos",
        filas.map((fila) => ({
          nombre: fila.nombre,
          correo: fila.correo,
          activo: true,
        })),
      );
      const datos = exigirRespuestaExitosa(respuesta);
      contactosConfigurados = contactosConfigurados.concat(
        datos.contactos || [],
      );
      identificadoresContactosSeleccionados.clear();
      renderizarContactos();
      document.getElementById("dialogoContactosMasivos").close();
      mostrarMensaje(respuesta.mensaje);
      await cargarConfiguracion();
    } catch (error) {
      errorOperacion = error;
    } finally {
      establecerDialogoContactosProcesando(false);
    }
    if (errorOperacion) {
      mostrarEstadoContactosMasivos(errorOperacion.message, true);
    }
  }

  function editarContacto(identificador) {
    const contacto = contactosConfigurados.find((elemento) => elemento.identificadorContacto === identificador);
    if (!contacto) return;
    document.getElementById("identificadorContacto").value = contacto.identificadorContacto;
    document.getElementById("nombreContacto").value = contacto.nombre;
    document.getElementById("correoContacto").value = contacto.correoOriginal;
    document.getElementById("contactoActivo").checked = contacto.activo;
    document.getElementById("botonEliminarContacto").classList.remove("oculto");
  }

  function limpiarFormularioContacto() {
    document.getElementById("formularioContacto").reset();
    document.getElementById("identificadorContacto").value = "";
    document.getElementById("contactoActivo").checked = true;
    document.getElementById("botonEliminarContacto").classList.add("oculto");
  }

  async function eliminarContactoSeleccionado() {
    const identificador = document.getElementById("identificadorContacto").value;
    const contacto = contactosConfigurados.find((elemento) => elemento.identificadorContacto === identificador);
    if (!contacto || !window.confirm(`¿Eliminar el contacto ${contacto.nombre}?`)) return;
    mostrarCarga(true, "Eliminando contacto…");
    try {
      const respuesta = await ejecutarServidor("eliminarContacto", identificador);
      exigirRespuestaExitosa(respuesta);
      limpiarFormularioContacto();
      mostrarMensaje(respuesta.mensaje);
      await cargarConfiguracion();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  async function guardarContactoDesdeFormulario(evento) {
    evento.preventDefault();
    mostrarCarga(true, "Guardando contacto…");
    try {
      const respuesta = await ejecutarServidor("guardarContacto", {
        identificadorContacto: document.getElementById("identificadorContacto").value,
        nombre: document.getElementById("nombreContacto").value,
        correo: document.getElementById("correoContacto").value,
        activo: document.getElementById("contactoActivo").checked,
      });
      exigirRespuestaExitosa(respuesta);
      mostrarMensaje(respuesta.mensaje);
      limpiarFormularioContacto();
      await cargarConfiguracion();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  async function abrirReporte() {
    try {
      const datos = exigirRespuestaExitosa(await ejecutarServidor("obtenerUrlReporteGeneral"));
      window.open(datos.url, "_blank", "noopener");
    } catch (error) {
      mostrarMensaje(error.message, true);
    }
  }
</script>
