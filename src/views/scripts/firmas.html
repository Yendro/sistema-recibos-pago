<script>
  let identificadorReciboFirma = "";
  let fotografiaFirmaBase64 = "";
  let lienzoTieneFirma = false;
  let dibujandoFirma = false;

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("botonActualizarFirmas").addEventListener("click", cargarPendientesFirma);
    document.getElementById("botonVolverBandeja").addEventListener("click", volverBandejaFirma);
    document.getElementById("botonLimpiarFirma").addEventListener("click", limpiarFirma);
    document.getElementById("botonConfirmarFirma").addEventListener("click", confirmarFirma);
    document.getElementById("archivoFotografiaFirma").addEventListener("change", procesarFotografiaFirma);
    configurarLienzoFirma();
    cargarPendientesFirma();
  });

  async function cargarPendientesFirma() {
    mostrarCarga(true, "Cargando recibos pendientes…");
    try {
      const datos = exigirRespuestaExitosa(await ejecutarServidor("listarRecibos", { pagina: 1, tamanoPagina: 100 }));
      const pendientes = datos.recibos.filter((recibo) => ["PENDIENTE_FIRMA", "ERROR_PDF"].includes(recibo.estado));
      renderizarPendientesFirma(pendientes);
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  function renderizarPendientesFirma(recibos) {
    const contenedor = document.getElementById("listaPendientesFirma");
    contenedor.replaceChildren();
    if (!recibos.length) {
      contenedor.append(crearElementoTexto("p", "No hay recibos pendientes de firma.", "vacio"));
      return;
    }
    recibos.forEach((recibo) => {
      const boton = document.createElement("button");
      boton.type = "button";
      boton.className = "tarjeta boton-texto";
      boton.style.textAlign = "left";
      boton.addEventListener("click", () => abrirReciboFirma(recibo.identificadorRecibo));
      boton.append(
        crearElementoTexto("strong", recibo.folio),
        crearElementoTexto("span", `${recibo.cliente} · ${formatearMoneda(recibo.importe)}`, "texto-secundario texto-pequeno"),
      );
      boton.lastChild.style.display = "block";
      contenedor.append(boton);
    });
  }

  async function abrirReciboFirma(identificadorRecibo) {
    mostrarCarga(true, "Preparando el recibo…");
    try {
      const datos = exigirRespuestaExitosa(await ejecutarServidor("obtenerReciboParaFirma", identificadorRecibo));
      identificadorReciboFirma = identificadorRecibo;
      fotografiaFirmaBase64 = "";
      const { recibo, tipoRecibo } = datos;
      const hoja = document.getElementById("hojaFirma");
      hoja.style.setProperty("--color-recibo", tipoRecibo.colorPrincipal);
      hoja.classList.toggle("formato-a4", tipoRecibo.formatoPapel === "A4");
      document.getElementById("empresaFirma").textContent = tipoRecibo.nombreEmpresa;
      document.getElementById("folioFirma").textContent = recibo.folio;
      document.getElementById("fechaFirmaVista").textContent = formatearFecha(recibo.fechaPago);
      document.getElementById("contenidoFirma").textContent = resolverTextoVista(tipoRecibo.textoPrincipal, recibo, tipoRecibo);
      const logotipo = document.getElementById("logotipoFirma");
      logotipo.src = tipoRecibo.logotipoUrlDatos || "";
      logotipo.classList.toggle("oculto", !tipoRecibo.logotipoUrlDatos);
      document.getElementById("vistaFotografiaFirma").classList.add("oculto");
      document.getElementById("sinFotografia").classList.remove("oculto");
      document.getElementById("archivoFotografiaFirma").value = "";
      document.getElementById("bandejaFirmas").classList.add("oculto");
      document.getElementById("panelFirma").classList.remove("oculto");
      window.setTimeout(limpiarFirma, 0);
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  function resolverTextoVista(texto, recibo, tipoRecibo) {
    const valores = {
      Folio: recibo.folio,
      FechaPago: formatearFecha(recibo.fechaPago),
      FechaCreacion: formatearFecha(recibo.fechaCreacion),
      Cliente: recibo.cliente,
      Proveedor: tipoRecibo.nombreProveedor,
      Importe: formatearMoneda(recibo.importe),
      ImporteLetra: recibo.importeLetra,
      Concepto: recibo.concepto,
    };
    return String(texto || "").replace(/{{\s*([^{}]+)\s*}}/g, (coincidencia, variable) => valores[variable.trim()] ?? coincidencia);
  }

  function configurarLienzoFirma() {
    const lienzo = document.getElementById("lienzoFirma");
    lienzo.addEventListener("pointerdown", iniciarTrazoFirma);
    lienzo.addEventListener("pointermove", continuarTrazoFirma);
    ["pointerup", "pointercancel", "pointerleave"].forEach((evento) => lienzo.addEventListener(evento, terminarTrazoFirma));
  }

  function prepararDimensionLienzo() {
    const lienzo = document.getElementById("lienzoFirma");
    const proporcion = Math.max(1, window.devicePixelRatio || 1);
    const rectangulo = lienzo.getBoundingClientRect();
    lienzo.width = Math.round(rectangulo.width * proporcion);
    lienzo.height = Math.round(rectangulo.height * proporcion);
    const contexto = lienzo.getContext("2d");
    contexto.scale(proporcion, proporcion);
    contexto.fillStyle = "#FFFFFF";
    contexto.fillRect(0, 0, rectangulo.width, rectangulo.height);
    contexto.strokeStyle = "#111111";
    contexto.lineWidth = 2.4;
    contexto.lineCap = "round";
    contexto.lineJoin = "round";
  }

  function obtenerPuntoFirma(evento) {
    const rectangulo = evento.currentTarget.getBoundingClientRect();
    return { x: evento.clientX - rectangulo.left, y: evento.clientY - rectangulo.top };
  }

  function iniciarTrazoFirma(evento) {
    evento.preventDefault();
    dibujandoFirma = true;
    evento.currentTarget.setPointerCapture(evento.pointerId);
    const punto = obtenerPuntoFirma(evento);
    const contexto = evento.currentTarget.getContext("2d");
    contexto.beginPath();
    contexto.moveTo(punto.x, punto.y);
  }

  function continuarTrazoFirma(evento) {
    if (!dibujandoFirma) return;
    evento.preventDefault();
    const punto = obtenerPuntoFirma(evento);
    const contexto = evento.currentTarget.getContext("2d");
    contexto.lineTo(punto.x, punto.y);
    contexto.stroke();
    lienzoTieneFirma = true;
  }

  function terminarTrazoFirma() { dibujandoFirma = false; }

  function limpiarFirma() {
    prepararDimensionLienzo();
    lienzoTieneFirma = false;
  }

  async function procesarFotografiaFirma(evento) {
    try {
      fotografiaFirmaBase64 = await comprimirImagen(evento.target.files[0], 1200, .78);
      const vista = document.getElementById("vistaFotografiaFirma");
      vista.src = fotografiaFirmaBase64;
      vista.classList.remove("oculto");
      document.getElementById("sinFotografia").classList.add("oculto");
    } catch (error) {
      fotografiaFirmaBase64 = "";
      mostrarMensaje(error.message, true);
    }
  }

  async function confirmarFirma() {
    if (!lienzoTieneFirma) return mostrarMensaje("Solicita al cliente que firme el recibo.", true);
    if (!fotografiaFirmaBase64) return mostrarMensaje("Toma la fotografía antes de continuar.", true);
    if (!window.confirm("¿La firma y la fotografía fueron revisadas y son correctas?")) return;
    mostrarCarga(true, "Generando el PDF final…");
    try {
      const firmaBase64 = document.getElementById("lienzoFirma").toDataURL("image/png");
      const respuesta = await ejecutarServidor("firmarYGenerarPdf", identificadorReciboFirma, firmaBase64, fotografiaFirmaBase64);
      const datos = exigirRespuestaExitosa(respuesta);
      mostrarMensaje(respuesta.mensaje);
      volverBandejaFirma();
      await cargarPendientesFirma();
    } catch (error) {
      mostrarMensaje(error.message, true);
    } finally {
      mostrarCarga(false);
    }
  }

  function volverBandejaFirma() {
    identificadorReciboFirma = "";
    fotografiaFirmaBase64 = "";
    document.getElementById("panelFirma").classList.add("oculto");
    document.getElementById("bandejaFirmas").classList.remove("oculto");
  }
</script>
