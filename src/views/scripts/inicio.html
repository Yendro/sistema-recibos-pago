<script>
  document.addEventListener("DOMContentLoaded", cargarResumenSistema);

  async function cargarResumenSistema() {
    try {
      const datos = exigirRespuestaExitosa(
        await ejecutarServidor("obtenerResumenInicio"),
      );
      if (!datos.inicializado) {
        document.getElementById("estadoInicializacion").classList.remove("oculto");
        document.getElementById("resumenSistema").classList.add("oculto");
        return;
      }
      document.getElementById("cantidadPendientesFirma").textContent =
        datos.pendientesFirma;
      document.getElementById("cantidadPendientesEnvio").textContent =
        datos.pendientesEnvio;
      document.getElementById("cantidadEnviados").textContent = datos.enviados;
    } catch (error) {
      mostrarMensaje(error.message, true);
    }
  }
</script>
